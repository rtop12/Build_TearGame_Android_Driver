name: Kernel Module Builder (Refactored)

on:
  workflow_dispatch:
    inputs:
      driver_name:
        description: "Driver Module Name (e.g., uid_priv.ko)"
        required: true
        default: "uid_priv.ko"
      target_arch:
        description: "Target Architecture"
        required: true
        default: "aarch64"
        options:
          - aarch64
          - x86_64

jobs:
  build-driver:
    runs-on: ubuntu-24.04

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 极度精简磁盘空间（Android Kernel 编译极吃空间）
      - name: Free up disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 12000
          swap-size-mb: 8096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 3. 安装编译必备依赖
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            bc \
            curl \
            git

      # 4. 安装 Google repo 工具
      - name: Install repo
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      # 5. 克隆 Android GKI Kernel 源码 (Android 14 Kernel 6.1)
      - name: Fetch Android GKI Kernel Source
        run: |
          mkdir -p /tmp/android_kernel
          cd /tmp/android_kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1 --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      # 6. 准备内核构建环境
      - name: Prepare kernel build environment
        run: |
          cd /tmp/android_kernel
          if [ "${{ inputs.target_arch }}" == "aarch64" ]; then
            ARCH="arm64"
          else
            ARCH="x86"
          fi

          # 使用 Bazel 编译并生成 headers
          tools/bazel build //common:kernel_${{ inputs.target_arch }}_headers

      # 7. 提取内核头文件路径 (重构了寻找路径的逻辑)
      - name: Locate kernel headers path
        run: |
          # 尝试多种可能存在的输出目录命名规则
          KERNEL_DIR="/tmp/android_kernel"
          
          if [ "${{ inputs.target_arch }}" == "aarch64" ]; then
            HEADER_DIR=$(ls -d "${KERNEL_DIR}/out/"*/kernel_aarch64_headers 2>/dev/null | head -n 1)
          else
            HEADER_DIR=$(ls -d "${KERNEL_DIR}/out/"*/kernel_x86_headers 2>/dev/null | head -n 1)
          fi

          if [ -z "$HEADER_DIR" ]; then
            echo "::error::Failed to locate kernel headers directory."
            echo "Please check if the kernel build was successful."
            exit 1
          fi

          # 将路径写入环境变量，供下一步使用
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
          echo "KERNEL_OUT=$HEADER_DIR" >> $GITHUB_ENV

          echo "Kernel headers located at: $HEADER_DIR"

      # 8. 外部模块编译 (Out-of-Tree Build)
      - name: Compile driver module
        run: |
          if [ "${{ inputs.target_arch }}" == "aarch64" ]; then
            ARCH="arm64"
          else
            ARCH="x86"
          fi

          KO_FILE="${{ inputs.driver_name }}"
          OBJ_M=${KO_FILE%.ko}.o

          mkdir -p /tmp/driver_build
          cp -r ./code/* /tmp/driver_build/

          # 动态生成标准的 Kbuild Makefile
          cat > /tmp/driver_build/Makefile <<EOF
obj-m := ${OBJ_M}

all:
	\$(MAKE) -C \${KERNEL_DIR} M=\${PWD} O=\${KERNEL_OUT} ARCH=${ARCH} modules

clean:
	\$(MAKE) -C \${KERNEL_DIR} M=\${PWD} O=\${KERNEL_OUT} ARCH=${ARCH} clean
EOF

          cd /tmp/driver_build
          
          # 开始编译
          make KERNEL_DIR="${KERNEL_DIR}" KERNEL_OUT="${KERNEL_OUT}" -j$(nproc)

          if [ ! -f "$KO_FILE" ]; then
            echo "::error::Compilation failed. $KO_FILE was not generated."
            exit 1
          fi

          echo "$KO_FILE generated successfully!"

      # 9. 上传产物
      - name: Upload compiled .ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.driver_name }}
          path: /tmp/driver_build/${{ inputs.driver_name }}
          if-no-files-found: error
