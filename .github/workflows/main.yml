name: Android Kernel Driver Builder (Standalone .ko)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel) (e.g., 14)'
        required: true
        default: '14'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1)'
        required: true
        default: '6.1'
      driver_name:
        description: 'Driver Module Name (e.g., mydriver.ko)'
        required: true
      target_arch:
        description: 'Target Architecture (aarch64, x86_64)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          swap-reclaim-mb: 8192

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison libssl-dev libelf-dev bc python3-pip curl

      - name: Install Google repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      - name: Sync Android kernel source
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} \
            --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Prepare kernel build tree (Generate Headers)
        run: |
          cd android-kernel
          if [ "${{ fromJSON(github.event.inputs.android_version) }}" -ge 14 ]; then
            echo "Building headers with Bazel..."
            tools/bazel build //common:kernel_${{ github.event.inputs.target_arch }}_headers
          else
            echo "Preparing build tree with build.sh..."
            BUILD_CONFIG=common/build.config.gki.${{ github.event.inputs.target_arch }} \
            build/build.sh prepare
          fi

      - name: Build Driver Module (Out-of-Tree)
        run: |
          # 1. 映射架构名称
          KERNEL_ARCH=""
          if [ "${{ github.event.inputs.target_arch }}" == "aarch64" ]; then
            KERNEL_ARCH="arm64"
          elif [ "${{ github.event.inputs.target_arch }}" == "x86_64" ]; then
            KERNEL_ARCH="x86"
          else
            KERNEL_ARCH="${{ github.event.inputs.target_arch }}"
          fi

          KERNEL_DIR="$(pwd)/android-kernel"
          KERNEL_OUT=""

          # 2. 【关键修复】先列出 out 下所有目录，排查路径；再精确匹配
          if [ "${{ fromJSON(github.event.inputs.android_version) }}" -ge 14 ]; then
            echo "Listing all dirs under out:"
            find "$KERNEL_DIR/out" -maxdepth 2 -type d
            KERNEL_OUT=$(find "$KERNEL_DIR/out" -maxdepth 2 -type d -name "kernel_${{ github.event.inputs.target_arch }}*" | head -n1)
          else
            KERNEL_OUT=$(find "$KERNEL_DIR/out" -maxdepth 2 -type d -name "android*" | head -n1)
          fi

          if [ -z "$KERNEL_OUT" ]; then
            echo "::error::Cannot find kernel output directory (headers). Please check the listing above."
            exit 1
          fi

          echo "Kernel Source: $KERNEL_DIR"
          echo "Kernel Out:    $KERNEL_OUT"
          echo "Kernel Arch:   $KERNEL_ARCH"

          # 3. 准备驱动编译目录（只拷贝 .c .h，不要拷贝你自己的 Makefile）
          mkdir -p driver-build
          cp ./code/*.c ./code/*.h driver-build/

          # 4. 生成临时 Makefile（obj-m 用模块名去掉 .ko 后缀）
          KO_NAME="${{ github.event.inputs.driver_name }}"
          MOD_NAME="${KO_NAME%.ko}"

          cat > driver-build/Makefile <<EOF
          obj-m += ${MOD_NAME}.o

          all:
          \t\$(MAKE) -C ${KERNEL_DIR} O=${KERNEL_OUT} ARCH=${KERNEL_ARCH} M=\$(CURDIR) modules

          clean:
          \t\$(MAKE) -C ${KERNEL_DIR} O=${KERNEL_OUT} ARCH=${KERNEL_ARCH} M=\$(CURDIR) clean
          EOF

          echo "=== Generated Makefile ==="
          cat driver-build/Makefile
          echo "=========================="

          # 5. 执行编译
          make -C driver-build -j$(nproc)

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: driver-build/${{ github.event.inputs.driver_name }}
          if-no-files-found: error
