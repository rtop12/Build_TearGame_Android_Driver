name: Android Kernel Driver Builder (Standalone .ko)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel) (e.g., 14)'
        required: true
        default: '14'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1)'
        required: true
        default: '6.1'
      driver_name:
        description: 'Driver Module Name (e.g., mydriver.ko)'
        required: true
      target_arch:
        description: 'Target Architecture (aarch64, x86_64)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extreme Disk Space Optimization
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024          # 系统盘仅预留 1GB，强制释放所有剩余空间
          swap-size-mb: 8192             # 增加 8GB 虚拟内存
          remove-dotnet: 'true'          # 卸载 .NET
          remove-android: 'true'         # 卸载无用 Android SDK
          remove-haskell: 'true'         # 卸载 Haskell
          remove-codeql: 'true'          # 卸载 CodeQL
          remove-docker-images: 'true'   # 清除所有 Docker 镜像
          swap-reclaim-mb: 8192          # 重新调整 Swap 大小

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3-pip curl

      - name: Install Google repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      - name: Sync Android kernel source
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} \
            --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Prepare kernel build tree (Generate Headers)
        run: |
          cd android-kernel
          if [ "${{ fromJSON(github.event.inputs.android_version) }}" -ge 14 ]; then
            echo "Building headers with Bazel..."
            tools/bazel build //common:kernel_${{ github.event.inputs.target_arch }}_headers
          else
            echo "Preparing build tree with build.sh..."
            BUILD_CONFIG=common/build.config.gki.${{ github.event.inputs.target_arch }} \
            build/build.sh prepare
          fi

      - name: Build Driver Module (Out-of-Tree)
        run: |
          # 1. 映射架构名称 (aarch64 -> arm64, x86_64 -> x86)
          KERNEL_ARCH=""
          if [ "${{ github.event.inputs.target_arch }}" == "aarch64" ]; then
            KERNEL_ARCH="arm64"
          elif [ "${{ github.event.inputs.target_arch }}" == "x86_64" ]; then
            KERNEL_ARCH="x86"
          else
            KERNEL_ARCH="${{ github.event.inputs.target_arch }}"
          fi

          # 2. 动态定位内核输出目录 (包含 Headers 的路径)
          KERNEL_DIR="$(pwd)/android-kernel"
          KERNEL_OUT=""
          
          if [ "${{ fromJSON(github.event.inputs.android_version) }}" -ge 14 ]; then
            KERNEL_OUT=$(find "$KERNEL_DIR/out" -maxdepth 3 -type d -name "kernel_*_headers" | head -n1)
          else
            KERNEL_OUT=$(find "$KERNEL_DIR/out" -maxdepth 3 -type d -name "android*" | head -n1)
          fi

          if [ -z "$KERNEL_OUT" ]; then
            echo "::error::Cannot find kernel output directory (headers)."
            exit 1
          fi

          echo "Kernel Source: $KERNEL_DIR"
          echo "Kernel Out:    $KERNEL_OUT"
          echo "Kernel Arch:   $KERNEL_ARCH"

          # 3. 准备驱动编译目录
          mkdir -p driver-build
          cp ./code/* driver-build/

          # 4. 写入外部模块编译的 Makefile
          cat > driver-build/Makefile <<'EOF'
          ifeq ($(KERNEL_DIR),)
          $(error KERNEL_DIR is not set)
          endif
          ifeq ($(KERNEL_OUT),)
          $(error KERNEL_OUT is not set)
          endif
          ifeq ($(DRIVER_NAME),)
          $(error DRIVER_NAME is not set)
          endif

          obj-m += $(DRIVER_NAME:.ko=.o)

          all:
          	$(MAKE) -C $(KERNEL_DIR) O=$(KERNEL_OUT) ARCH=$(KERNEL_ARCH) M=$(CURDIR) modules
          EOF

          # 5. 执行编译
          make -C driver-build \
            KERNEL_DIR="$KERNEL_DIR" \
            KERNEL_OUT="$KERNEL_OUT" \
            KERNEL_ARCH="$KERNEL_ARCH" \
            DRIVER_NAME="${{ github.event.inputs.driver_name }}" \
            -j$(nproc)

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: driver-build/${{ github.event.inputs.driver_name }}
          if-no-files-found: error
