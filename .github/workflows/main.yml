name: Android Kernel Driver Builder (Standalone .ko)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel) (e.g., 14)'
        required: true
        default: '14'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1)'
        required: true
        default: '6.1'
      driver_name:
        description: 'Driver Module Name (e.g., mydriver.ko)'
        required: true
      target_arch:
        description: 'Target Architecture (aarch64, x86_64)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker rmi $(docker images -aq) 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison libssl-dev libelf-dev bc curl

      - name: Install Google repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      - name: Sync Android kernel source
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} \
            --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Prepare kernel build tree (Generate Headers)
        run: |
          cd android-kernel
          if [ "${{ fromJSON(github.event.inputs.android_version) }}" -ge 14 ]; then
            echo "Building headers with Bazel..."
            tools/bazel build //common:kernel_${{ github.event.inputs.target_arch }}_headers
          else
            echo "Preparing build tree with build.sh..."
            BUILD_CONFIG=common/build.config.gki.${{ github.event.inputs.target_arch }} \
            build/build.sh prepare
          fi

      - name: Build Driver Module (Out-of-Tree)
        run: |
          KERNEL_ARCH=""
          if [ "${{ github.event.inputs.target_arch }}" == "aarch64" ]; then
            KERNEL_ARCH="arm64"
          elif [ "${{ github.event.inputs.target_arch }}" == "x86_64" ]; then
            KERNEL_ARCH="x86"
          else
            KERNEL_ARCH="${{ github.event.inputs.target_arch }}"
          fi

          KERNEL_DIR="$(pwd)/android-kernel"
          KERNEL_OUT=""

          if [ "${{ fromJSON(github.event.inputs.android_version) }}" -ge 14 ]; then
            KERNEL_OUT=$(find "$KERNEL_DIR/out" -type d -name "kernel_${{ github.event.inputs.target_arch }}*" 2>/dev/null | head -n1)
          else
            KERNEL_OUT=$(find "$KERNEL_DIR/out" -type d -name "android*" 2>/dev/null | head -n1)
          fi

          if [ -z "$KERNEL_OUT" ]; then
            echo "::error::Cannot find kernel headers output directory."
            find "$KERNEL_DIR/out" -type d 2>/dev/null | head -20
            exit 1
          fi

          echo "Kernel Source: $KERNEL_DIR"
          echo "Kernel Out:    $KERNEL_OUT"
          echo "Kernel Arch:   $KERNEL_ARCH"

          mkdir -p driver-build
          cp ./code/* driver-build/

          KO_NAME="${{ github.event.inputs.driver_name }}"
          MOD_NAME="${KO_NAME%.ko}"

          cat > driver-build/Makefile <<EOF
          obj-m += ${MOD_NAME}.o

          all:
          	\$(MAKE) -C ${KERNEL_DIR} O=${KERNEL_OUT} ARCH=${KERNEL_ARCH} M=\$(CURDIR) modules

          clean:
          	\$(MAKE) -C ${KERNEL_DIR} O=${KERNEL_OUT} ARCH=${KERNEL_ARCH} M=\$(CURDIR) clean
          EOF

          echo "=== Generated Makefile ==="
          cat driver-build/Makefile

          make -C driver-build -j$(nproc)

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: driver-build/${{ github.event.inputs.driver_name }}
          if-no-files-found: error
