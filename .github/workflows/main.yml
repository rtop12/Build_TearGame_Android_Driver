name: Android Kernel Driver Builder

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version (e.g., 14)"
        required: true
        default: "14"
      kernel_version:
        description: "Kernel Version (e.g., 6.1)"
        required: true
        default: "6.1"
      driver_name:
        description: "Driver Name (e.g., uid_priv.ko)"
        required: true
        default: "uid_priv.ko"
      target_arch:
        description: "Target Architecture"
        required: true
        default: "aarch64"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3 curl git

      - name: Install repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      - name: Sync Android kernel source
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Prepare kernel build tree
        run: |
          cd android-kernel
          if [ "${{ github.event.inputs.android_version }}" -ge 14 ]; then
            tools/bazel build //common:kernel_${{ github.event.inputs.target_arch }}_headers
          else
            BUILD_CONFIG=common/build.config.gki.${{ github.event.inputs.target_arch }} LTO=thin build/build.sh prepare
          fi

      - name: Build driver module (uid_priv.ko)
        run: |
          # 统一锁定为 uid_priv，防止本地测试与CI混淆
          DRIVER_NAME="uid_priv.ko"
          KO_BASE="uid_priv"
          KERNEL_ARCH="arm64"

          KERNEL_DIR="$(pwd)/android-kernel"
          # 使用通配符精准匹配内核输出目录
          KERNEL_OUT=$(ls -d "${KERNEL_DIR}/out"/*/kernel_aarch64_headers 2>/dev/null | head -n1)

          if [ -z "$KERNEL_OUT" ]; then
            echo "Error: Kernel headers directory not found! Available directories:"
            ls -l "${KERNEL_DIR}/out/"
            exit 1
          fi

          echo "Found kernel headers at: $KERNEL_OUT"

          mkdir -p driver-build
          cp ./code/* driver-build/

          cat > driver-build/Makefile <<'EOF'
obj-m := uid_priv.o

all:
	$(MAKE) -C $(KERNEL_DIR) O=$(KERNEL_OUT) ARCH=$(KERNEL_ARCH) M=$(CURDIR) modules
EOF

          cd driver-build
          make KERNEL_DIR="$KERNEL_DIR" KERNEL_OUT="$KERNEL_OUT" KERNEL_ARCH="$KERNEL_ARCH" -j$(nproc)

          if [ ! -f "$DRIVER_NAME" ]; then
            echo "Build failed: $DRIVER_NAME not generated!"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: driver-build/uid_priv.ko
