name: Android Kernel Driver Builder (Standalone .ko)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel)'
        required: true
        default: '14'
      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
      driver_name:
        description: 'Driver Module Name (e.g., uid_priv.ko)'
        required: true
        default: 'uid_priv.ko'
      target_arch:
        description: 'Target Architecture (aarch64, x86_64)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space manually
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/swift /usr/local/.ghcup
          sudo docker rmi $(docker images -aq) 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libssl-dev libelf-dev bc curl

      - name: Install Google repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      - name: Sync Android kernel source
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} \
            --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Build Driver Module (Traditional Make + Clang)
        run: |
          KERNEL_DIR="$(pwd)/android-kernel"
          KO_NAME="${{ github.event.inputs.driver_name }}"
          MOD_NAME="${KO_NAME%.ko}"

          # 1. 动态查找 Clang 工具链路径
          CLANG_DIR=$(find "$KERNEL_DIR/prebuilts/clang/host/linux-x86" -maxdepth 1 -type d -name "clang-*" 2>/dev/null | head -n1)
          if [ -z "$CLANG_DIR" ]; then
            echo "::error::Cannot find Clang toolchain in prebuilts directory."
            ls -la "$KERNEL_DIR/prebuilts/clang/host/linux-x86/" 2>/dev/null || echo "prebuilts dir not found"
            exit 1
          fi
          echo "Found Clang at: $CLANG_DIR"
          export PATH="$CLANG_DIR/bin:$PATH"

          # 2. 映射架构
          if [ "${{ github.event.inputs.target_arch }}" == "aarch64" ]; then
            KERNEL_ARCH="arm64"
          else
            KERNEL_ARCH="x86"
          fi

          echo "Using ARCH=$KERNEL_ARCH, LLVM=1, LLVM_IAS=1"

          # 3. 进入内核源码目录
          cd "$KERNEL_DIR/common"

          # 4. 生成内核配置
          echo "=== Generating defconfig ==="
          make LLVM=1 LLVM_IAS=1 ARCH=${KERNEL_ARCH} gki_defconfig

          # 5. 准备构建环境（编译 scripts、生成 autoconf.h 等）
          echo "=== Preparing build environment ==="
          make LLVM=1 LLVM_IAS=1 ARCH=${KERNEL_ARCH} prepare modules_prepare

          # 6. 准备驱动源码目录
          cd "$KERNEL_DIR"
          mkdir -p driver-build
          cp ./code/*.c ./code/*.h driver-build/ 2>/dev/null || cp ./code/* driver-build/

          cat > driver-build/Makefile <<EOF
          obj-m += ${MOD_NAME}.o

          all:
          	\$(MAKE) LLVM=1 LLVM_IAS=1 ARCH=${KERNEL_ARCH} M=\$(CURDIR) modules

          clean:
          	\$(MAKE) LLVM=1 LLVM_IAS=1 ARCH=${KERNEL_ARCH} M=\$(CURDIR) clean
          EOF

          echo "=== Makefile ==="
          cat driver-build/Makefile

          # 7. 编译外部模块（-C 指向内核源码，M= 指向模块目录）
          echo "=== Building module ==="
          make -C "$KERNEL_DIR/common" LLVM=1 LLVM_IAS=1 ARCH=${KERNEL_ARCH} M="$KERNEL_DIR/driver-build" modules

          echo "=== Generated .ko files ==="
          find "$KERNEL_DIR/driver-build" -name "*.ko"

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: android-kernel/driver-build/${{ github.event.inputs.driver_name }}
          if-no-files-found: error
