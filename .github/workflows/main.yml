name: Android Kernel Driver Builder (Standalone .ko)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel) (e.g., 14)'
        required: true
        default: '14'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1)'
        required: true
        default: '6.1'
      driver_name:
        description: 'Driver Module Name (e.g., uid_priv.ko)'
        required: true
        default: 'uid_priv.ko'
      target_arch:
        description: 'Target Architecture (aarch64, x86_64)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker rmi $(docker images -aq) 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison libssl-dev libelf-dev bc curl

      - name: Install Google repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      - name: Sync Android kernel source
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} \
            --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Inject Driver & Setup Bazel DDK Rule
        run: |
          # 1. 提取模块名称（去掉 .ko 后缀）
          MOD_NAME="${{ github.event.inputs.driver_name }}"
          MOD_NAME="${MOD_NAME%.ko}"

          # 2. 在内核源码树中创建专属驱动目录
          DRIVER_DIR="android-kernel/common/drivers/my_modules"
          mkdir -p "$DRIVER_DIR"

          # 3. 拷贝源码文件（.c 和 .h）
          cp ./code/*.c ./code/*.h "$DRIVER_DIR/" 2>/dev/null || true

          # 4. 【关键】动态生成 Bazel 编译规则 (BUILD.bazel)
          cat > "$DRIVER_DIR/BUILD.bazel" <<EOF
          package(default_visibility = ["//visibility:public"])

          load("@build_kernel//:build_defs.bzl", "kernel_module")

          kernel_module(
              name = "${MOD_NAME}",
              srcs = ["${MOD_NAME}.c"],
              hdrs = glob(["*.h"]),
          )
          EOF

          echo "=== Generated BUILD.bazel ==="
          cat "$DRIVER_DIR/BUILD.bazel"

      - name: Build .ko Module via Bazel
        run: |
          cd android-kernel
          MOD_NAME="${{ github.event.inputs.driver_name }}"
          MOD_NAME="${MOD_NAME%.ko}"

          echo "Building module //common/drivers/my_modules:${MOD_NAME} with Bazel..."
          # 使用 Bazel 仅编译该特定模块，速度极快，产物为 .ko
          tools/bazel build //common/drivers/my_modules:${MOD_NAME}

      - name: Extract and Upload .ko Artifact
        run: |
          MOD_NAME="${{ github.event.inputs.driver_name }}"
          # 动态在 bazel 庞大的输出目录中定位刚刚编译出的 .ko 文件
          KO_FILE=$(find android-kernel/out -name "${MOD_NAME}" -type f 2>/dev/null | head -n1)
          
          if [ -z "$KO_FILE" ]; then
            echo "::error::Failed to find compiled .ko file in Bazel out directory."
            find android-kernel/out -name "*.ko" 2>/dev/null | head -10
            exit 1
          fi

          echo "Found compiled module at: $KO_FILE"
          mkdir -p final-artifact
          cp "$KO_FILE" "final-artifact/${MOD_NAME}"

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: final-artifact/${{ github.event.inputs.driver_name }}
          if-no-files-found: error
