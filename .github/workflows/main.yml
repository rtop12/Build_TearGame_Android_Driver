name: Android Kernel Driver Builder (Standalone .ko)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel)'
        required: true
        default: '14'
      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
      driver_name:
        description: 'Driver Module Name (e.g., uid_priv.ko)'
        required: true
        default: 'uid_priv.ko'
      target_arch:
        description: 'Target Architecture (aarch64, x86_64)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space manually
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/swift /usr/local/.ghcup
          sudo docker rmi $(docker images -aq) 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libssl-dev libelf-dev bc curl

      - name: Install Google repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      - name: Sync Android kernel source
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} \
            --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Generate headers via Bazel (official way for android14-6.1)
        run: |
          cd android-kernel
          echo "Building headers with Bazel..."
          tools/bazel build //common:kernel_${{ github.event.inputs.target_arch }}_headers
          echo "Bazel build done. Searching for .config and headers..."

          # 全局搜索 .config 文件
          CONFIG_FILE=$(find "$(pwd)/out" -name ".config" -type f 2>/dev/null | head -n1)
          if [ -z "$CONFIG_FILE" ]; then
            echo "::error::Cannot find .config in Bazel output."
            find "$(pwd)/out" -maxdepth 4 -type f -name "*.config" 2>/dev/null | head -5
            exit 1
          fi
          echo "Found .config at: $CONFIG_FILE"

          # .config 所在的目录就是内核构建输出目录
          KERNEL_OUT_DIR=$(dirname "$CONFIG_FILE")
          echo "Kernel output directory: $KERNEL_OUT_DIR"

          # 验证头文件是否存在
          if [ ! -f "$KERNEL_OUT_DIR/include/generated/autoconf.h" ] && \
             [ ! -f "$KERNEL_OUT_DIR/include/config/auto.conf" ]; then
            echo "::warning::autoconf.h not found in expected location, but .config exists."
          fi

          echo "KERNEL_OUT_DIR=$KERNEL_OUT_DIR" >> $GITHUB_ENV

      - name: Build Driver Module (Out-of-Tree via make)
        run: |
          KERNEL_DIR="$(pwd)/android-kernel/common"
          KERNEL_OUT="${{ env.KERNEL_OUT_DIR }}"

          if [ -z "$KERNEL_OUT" ] || [ ! -d "$KERNEL_OUT" ]; then
            echo "::error::KERNEL_OUT not set or not a directory."
            exit 1
          fi

          # 映射架构
          if [ "${{ github.event.inputs.target_arch }}" == "aarch64" ]; then
            KERNEL_ARCH="arm64"
          else
            KERNEL_ARCH="x86"
          fi

          echo "Kernel Source: $KERNEL_DIR"
          echo "Kernel Out:    $KERNEL_OUT"
          echo "Kernel Arch:   $KERNEL_ARCH"

          # 准备驱动编译目录
          mkdir -p driver-build
          cp ./code/*.c ./code/*.h driver-build/ 2>/dev/null || cp ./code/* driver-build/

          # 生成 Makefile
          KO_NAME="${{ github.event.inputs.driver_name }}"
          MOD_NAME="${KO_NAME%.ko}"

          cat > driver-build/Makefile <<EOF
          obj-m += ${MOD_NAME}.o

          all:
          	\$(MAKE) -C ${KERNEL_DIR} O=${KERNEL_OUT} ARCH=${KERNEL_ARCH} M=\$(CURDIR) modules

          clean:
          	\$(MAKE) -C ${KERNEL_DIR} O=${KERNEL_OUT} ARCH=${KERNEL_ARCH} M=\$(CURDIR) clean
          EOF

          echo "=== Makefile ==="
          cat driver-build/Makefile

          # 查找 Clang 工具链并加入 PATH
          CLANG_DIR=$(find "$(pwd)/android-kernel/prebuilts/clang/host/linux-x86" -maxdepth 1 -type d -name "clang-*" 2>/dev/null | head -n1)
          if [ -n "$CLANG_DIR" ]; then
            export PATH="$CLANG_DIR/bin:$PATH"
            echo "Using Clang from: $CLANG_DIR/bin"
            CLANG_FLAG="LLVM=1 LLVM_IAS=1"
          else
            echo "Clang not found, using GCC"
            CLANG_FLAG=""
          fi

          # 编译模块
          echo "=== Building module ==="
          make -C driver-build -j$(nproc) ${CLANG_FLAG}

          echo "=== Generated .ko files ==="
          find driver-build -name "*.ko"

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: driver-build/${{ github.event.inputs.driver_name }}
          if-no-files-found: error
