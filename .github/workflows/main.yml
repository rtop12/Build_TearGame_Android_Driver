name: Android Kernel Driver Builder (Standalone .ko)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android Version (e.g., 14)"
        required: true
      kernel_version:
        description: "Kernel Version (e.g., 6.1)"
        required: true
      driver_name:
        description: "Driver Module Name (e.g., mydriver.ko)"
        required: true
      target_arch:
        description: "Target Architecture (aarch64, x86_64)"
        required: true
        default: "aarch64"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3-pip

      - name: Download Android Kernel Sources
        run: |
          sudo pip3 install repo
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} \
            --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Prepare kernel build tree (Generate Headers)
        run: |
          cd android-kernel
          if [ "${{ fromJSON(github.event.inputs.android_version) }}" -ge 14 ]; then
            # Android 14+ 使用 Bazel 准备内核头文件
            tools/bazel build //common:kernel_${{ github.event.inputs.target_arch }}_headers
          else
            # Android 13 及以下使用 build.sh prepare
            BUILD_CONFIG=common/build.config.gki.${{ github.event.inputs.target_arch }} \
              build/build.sh prepare
          fi

      - name: Build Driver Module (Out-of-Tree)
        run: |
          # 1. 映射架构名称 (aarch64 -> arm64, x86_64 -> x86)
          ARCH_MAP_aarch64="arm64"
          ARCH_MAP_x86_64="x86"
          KERNEL_ARCH="${ARCH_MAP_${{ github.event.inputs.target_arch }}:-${{ github.event.inputs.target_arch }}}"

          # 2. 动态定位内核输出目录 (Headers 所在路径)
          if [ "${{ fromJSON(github.event.inputs.android_version) }}" -ge 14 ]; then
            KERNEL_OUT="$(find ./android-kernel/out -maxdepth 3 -type d -name 'kernel_*_headers' | head -n1)"
          else
            KERNEL_OUT="$(find ./android-kernel/out -maxdepth 3 -type d -name 'android*' | head -n1)"
          fi

          # 3. 创建临时构建目录
          mkdir -p driver-build
          cp ./code/* driver-build/

          # 4. 写入外部模块编译的 Makefile
          cat > driver-build/Makefile <<'MAKE'
          ifeq ($(KERNEL_DIR),)
          $(error KERNEL_DIR is not set)
          endif
          ifeq ($(KERNEL_OUT),)
          $(error KERNEL_OUT is not set)
          endif
          ifeq ($(DRIVER_NAME),)
          $(error DRIVER_NAME is not set)
          endif

          obj-m += $(DRIVER_NAME:.ko=.o)

          all:
              $(MAKE) -C $(KERNEL_DIR) O=$(KERNEL_OUT) ARCH=$(KERNEL_ARCH) M=$(CURDIR) modules
          MAKE

          # 5. 执行编译
          make -C driver-build \
            KERNEL_DIR="$(pwd)/android-kernel" \
            KERNEL_OUT="$KERNEL_OUT" \
            KERNEL_ARCH="$KERNEL_ARCH" \
            DRIVER_NAME="${{ github.event.inputs.driver_name }}" \
            -j$(nproc)

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: driver-build/${{ github.event.inputs.driver_name }}
