name: Android Kernel Tear Builder

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel) (e.g., 14)'
        required: true
      kernel_version:
        description: 'Kernel Version (e.g., 6.1)'
        required: true
      driver_name:
        description: 'Driver Module Name (e.g., devcfg.ko)'
        required: true
      target_arch:
        description: 'Target Architecture (aarch64, x86_64, etc.)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker rmi $(docker image ls -aq) 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Prepare kerneldriver directory
        run: |
          mkdir -p kerneldriver
          mv ./code/*.h ./code/*.c ./code/Makefile ./code/BUILD.bazel kerneldriver/ 2>/dev/null || \
          mv ./code/*.h ./code/*.c ./code/Makefile kerneldriver/
          echo "=== kerneldriver contents ==="
          ls -lh kerneldriver/

      - name: Install repo tool
        run: |
          sudo curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Set up Android Kernel source
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync
          find . -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf .repo
          df -h

      - name: Copy kerneldriver
        run: |
          cd android-kernel
          cp -r ../kerneldriver common/drivers

      - name: Modify Makefile
        run: |
          cd android-kernel
          echo "obj-y += kerneldriver/" >> common/drivers/Makefile

      - name: Add module to GKI modules list
        if: ${{ github.event.inputs.android_version > 13 }}
        run: |
          cd android-kernel
          DRIVER_BASENAME=$(basename "${{ github.event.inputs.driver_name }}" .ko)
          MODULE_PATH="drivers/kerneldriver/${DRIVER_BASENAME}.ko"

          awk -i inplace -v module="$MODULE_PATH" '
            BEGIN { added=0 }
            /_COMMON_GKI_MODULES_LIST = \[/ { in_list=1 }
            in_list && /\]/ {
              if (!added) {
                print "    \"" module "\","
                added=1
              }
              in_list=0
            }
            in_list && !added {
              if (module < $0) {
                print "    \"" module "\","
                added=1
              }
            }
            { print }
          ' common/modules.bzl

      - name: Prepare module list for legacy builds
        if: ${{ github.event.inputs.android_version <= 13 }}
        run: |
          cd android-kernel
          echo "drivers/kerneldriver/${{ github.event.inputs.driver_name }}" \
            >> common/android/gki_${{ github.event.inputs.target_arch }}_modules

      - name: Increase stack frame size limit
        run: |
          cd android-kernel
          find . -type f -name "Makefile*" -exec sed -i 's/-Wframe-larger-than=[0-9]*/-Wframe-larger-than=4096/g' {} +
          grep -q "FRAME_WARN" common/Makefile || \
            echo 'KBUILD_CFLAGS += -Wframe-larger-than=4096' >> common/Makefile

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python-is-python3

      - name: Fix missing kprobe symbols for Android 13
        if: ${{ github.event.inputs.android_version == '13' }}
        run: |
          cd android-kernel
          for symbol in register_kprobe unregister_kprobe; do
            grep -q "$symbol" common/android/abi_gki_${{ github.event.inputs.target_arch }} || \
            echo "$symbol" >> common/android/abi_gki_${{ github.event.inputs.target_arch }}
          done
          sed -i '/EXPORT_SYMBOL(unregister_kprobe);/a EXPORT_SYMBOL(register_kprobe);' common/kernel/kprobes.c

      - name: Build kernel module
        run: |
          cd android-kernel
          DIST_DIR=$(pwd)/out/dist
          mkdir -p "$DIST_DIR"

          if [ "${{ github.event.inputs.android_version }}" -le 13 ]; then
            BUILD_CONFIG=common/build.config.gki.${{ github.event.inputs.target_arch }} \
              LTO=thin build/build.sh -j32
          else
            echo "Using Bazel build system for Android ${{ github.event.inputs.android_version }}"
            tools/bazel run //common:kernel_${{ github.event.inputs.target_arch }}_dist -- \
              --dist_dir="$DIST_DIR" -j$(nproc)
          fi

          echo "DIST_DIR=$DIST_DIR" >> $GITHUB_ENV

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          DRIVER_BASENAME=$(basename "${{ github.event.inputs.driver_name }}" .ko)

          if [ "${{ github.event.inputs.android_version }}" -gt 13 ]; then
            echo "=== Searching for .ko in Bazel dist_dir ==="
            find "${DIST_DIR}" -name "*.ko" -type f 2>/dev/null | while read -r ko_path; do
              ko_name=$(basename "$ko_path")
              ko_size=$(stat -c%s "$ko_path" 2>/dev/null || echo 0)
              if [ "$ko_size" -lt 52428800 ]; then
                if [ "$ko_name" = "${DRIVER_BASENAME}.ko" ]; then
                  cp -v "$ko_path" "artifacts/${DRIVER_BASENAME}.ko"
                else
                  cp -v "$ko_path" "artifacts/${ko_name}"
                fi
                echo "Copied: $ko_path"
              fi
            done
          else
            cd android-kernel/out/android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}/dist
            for ko in *.ko; do
              [ -f "$ko" ] || continue
              size=$(stat -c%s "$ko" 2>/dev/null || echo 0)
              if [ "$size" -lt 52428800 ]; then
                cp -v "$ko" ../../../../artifacts/ 2>/dev/null || true
              fi
            done
          fi

          echo "=== Artifacts ==="
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: artifacts/
