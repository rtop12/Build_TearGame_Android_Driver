name: Android Kernel Driver Builder (Standalone .ko)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel) (e.g., 14)'
        required: true
        default: '14'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1)'
        required: true
        default: '6.1'
      driver_name:
        description: 'Driver Module Name (e.g., uid_priv.ko)'
        required: true
        default: 'uid_priv.ko'
      target_arch:
        description: 'Target Architecture (aarch64, x86_64)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space manually
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker rmi $(docker images -aq) 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison libssl-dev libelf-dev bc curl

      - name: Install Google repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      - name: Sync Android kernel source
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} \
            --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Prepare kernel build tree with build.sh
        run: |
          cd android-kernel
          # 映射架构到 build config 文件名
          if [ "${{ github.event.inputs.target_arch }}" == "aarch64" ]; then
            CFG_ARCH="aarch64"
          else
            CFG_ARCH="x86_64"
          fi

          echo "Using build config: common/build.config.gki.${CFG_ARCH}"
          BUILD_CONFIG=common/build.config.gki.${CFG_ARCH} \
          build/build.sh prepare

          echo "Prepare done. Checking output dir:"
          ls -la out/

      - name: Build Driver Module (Out-of-Tree via make)
        run: |
          # 1. 映射架构
          if [ "${{ github.event.inputs.target_arch }}" == "aarch64" ]; then
            KERNEL_ARCH="arm64"
            CFG_ARCH="aarch64"
          else
            KERNEL_ARCH="x86"
            CFG_ARCH="x86_64"
          fi

          KERNEL_DIR="$(pwd)/android-kernel"
          # prepare 生成的输出目录路径
          KERNEL_OUT="${KERNEL_DIR}/out/android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}/common"

          if [ ! -d "$KERNEL_OUT" ]; then
            echo "::error::Output dir not found: $KERNEL_OUT"
            echo "Available dirs in out/:"
            find "${KERNEL_DIR}/out" -maxdepth 2 -type d
            exit 1
          fi

          echo "Kernel Source: $KERNEL_DIR"
          echo "Kernel Out:    $KERNEL_OUT"
          echo "Kernel Arch:   $KERNEL_ARCH"

          # 2. 准备驱动编译目录
          mkdir -p driver-build
          cp ./code/*.c ./code/*.h driver-build/ 2>/dev/null || cp ./code/* driver-build/

          # 3. 生成 Makefile
          KO_NAME="${{ github.event.inputs.driver_name }}"
          MOD_NAME="${KO_NAME%.ko}"

          cat > driver-build/Makefile <<EOF
          obj-m += ${MOD_NAME}.o

          all:
          	\$(MAKE) -C ${KERNEL_DIR} O=${KERNEL_OUT} ARCH=${KERNEL_ARCH} M=\$(CURDIR) modules

          clean:
          	\$(MAKE) -C ${KERNEL_DIR} O=${KERNEL_OUT} ARCH=${KERNEL_ARCH} M=\$(CURDIR) clean
          EOF

          echo "=== Makefile ==="
          cat driver-build/Makefile

          # 4. 编译模块
          make -C driver-build -j$(nproc)

          # 5. 确认 .ko 生成
          echo "=== Looking for .ko ==="
          find driver-build -name "*.ko"

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: driver-build/${{ github.event.inputs.driver_name }}
          if-no-files-found: error
