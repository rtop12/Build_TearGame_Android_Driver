name: Build Android Kernel Module

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android version (12-15)"
        required: true
        default: "14"
      driver_name:
        description: "Driver .ko filename"
        required: true
        default: "devcfg.ko"
      kernel_branch:
        description: "Kernel manifest branch"
        required: false
        default: "common-android14-6.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver code
        uses: actions/checkout@v4
        with:
          path: driver-src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip gawk

      - name: Fix ncurses compatibility
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ln -sf /usr/lib32/libncurses.so.6 /usr/lib32/libncurses.so.5
          sudo ln -sf /usr/lib32/libtinfo.so.6 /usr/lib32/libtinfo.so.5

      - name: Setup repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init kernel source
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "${{ github.event.inputs.kernel_branch }}" --depth=1
          repo sync -c -j$(nproc)

      - name: Copy driver into kernel tree
        run: |
          DRIVER_BASENAME=$(basename "${{ github.event.inputs.driver_name }}" .ko)
          cd android-kernel
          mkdir -p common/drivers/kerneldriver
          cp -r ../driver-src/code/* common/drivers/kerneldriver/

      - name: Remove kerneldriver from drivers/Makefile
        run: |
          cd android-kernel
          sed -i '/obj-y.*+=.*kerneldriver/d' common/drivers/Makefile
          sed -i '/obj-m.*+=.*kerneldriver/d' common/drivers/Makefile

      - name: Add module to GKI modules list
        if: ${{ github.event.inputs.android_version > 13 }}
        run: |
          cd android-kernel
          DRIVER_BASENAME=$(basename "${{ github.event.inputs.driver_name }}" .ko)
          MODULE_PATH="drivers/kerneldriver/${DRIVER_BASENAME}.ko"

          awk -i inplace -v module="$MODULE_PATH" '
            BEGIN { added=0 }
            /_COMMON_GKI_MODULES_LIST = \[/ { in_list=1 }
            in_list && /\]/ {
              if (!added) {
                print "    \"" module "\","
                added=1
              }
              in_list=0
            }
            in_list && !added {
              if (module < $0) {
                print "    \"" module "\","
                added=1
              }
            }
            { print }
          ' common/modules.bzl

      - name: Build kernel
        run: |
          cd android-kernel
          DIST_DIR=$(pwd)/out/dist
          mkdir -p "$DIST_DIR"

          ANDROID_VER="${{ github.event.inputs.android_version }}"

          if [ "$ANDROID_VER" -le 12 ]; then
            BUILD_CONFIG=common/build.config.gki.aarch64 \
              LTO=thin build/build.sh -j$(nproc)
          elif [ "$ANDROID_VER" -le 13 ]; then
            BUILD_CONFIG=common/build.config.gki.aarch64 \
              LTO=thin build/build.sh -j$(nproc)
          else
            tools/bazel run //common:kernel_aarch64_dist -- \
              --dist_dir="$DIST_DIR" -j$(nproc)
          fi

          echo "DIST_DIR=$DIST_DIR" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: ${{ env.DIST_DIR }}
