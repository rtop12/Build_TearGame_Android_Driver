name: Android Kernel Driver Builder (Standalone .ko)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel)'
        required: true
        default: '14'
      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
      driver_name:
        description: 'Driver Module Name (e.g., uid_priv.ko)'
        required: true
        default: 'uid_priv.ko'
      target_arch:
        description: 'Target Architecture (aarch64, x86_64)'
        required: true
        default: 'aarch64'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space manually
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/swift /usr/local/.ghcup
          sudo docker rmi $(docker images -aq) 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libssl-dev libelf-dev bc curl

      - name: Install Google repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-内部工具s/repo -o /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo

      - name: Sync Android kernel source
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }} \
            --depth=1
          repo sync -j$(nproc) -c --no-tags --optimized-fetch --force-sync

      - name: Build full GKI kernel via Bazel (gives complete out_dir + Module.symvers)
        run: |
          cd android-kernel
          tools/bazel build //common:kernel_${{ github.event.inputs.target_arch }}
          echo "Bazel full-kernel build done."

      - name: Locate complete out_dir and matching clang
        run: |
          cd android-kernel

          # 1. 真正可外编的 out_dir = 含 Module.symvers 的目录
          SYMVER=$(find out/bazel -type f -name "Module.symvers" -path "*out_dir*" 2>/dev/null | head -n1)
          if [ -z "$SYMVER" ]; then
            echo "::error::No Module.symvers found in Bazel out_dir. Kernel build may have failed."
            find out/bazel -type f -name "Module.symvers" 2>/dev/null | head
            exit 1
          fi
          KERNEL_OUT=$(dirname "$SYMVER")
          echo "KERNEL_OUT=$PWD/$KERNEL_OUT" >> $GITHUB_ENV

          # 2. 锁定与内核同版本(r487747c)的 clang，避免回退到系统 clang14
          CLANG_DIR=$(find prebuilts/clang/host/linux-x86 -maxdepth 1 -type d -name "*487747*" 2>/dev/null | head -n1)
          if [ -z "$CLANG_DIR" ]; then
            CLANG_DIR=$(find prebuilts/clang/host/linux-x86 -maxdepth 1 -type d -name "clang-r*" 2>/dev/null | sort | tail -n1)
          fi
          if [ -z "$CLANG_DIR" ]; then
            echo "::error::Cannot find prebuilt clang toolchain."
            exit 1
          fi
          echo "CLANG_BIN=$CLANG_DIR/bin" >> $GITHUB_ENV
          echo "Using clang at: $CLANG_DIR/bin"

      - name: Build Driver Module (Out-of-Tree with matching clang17)
        run: |
          KERNEL_DIR="$(pwd)/android-kernel/common"
          KERNEL_OUT="${{ env.KERNEL_OUT }}"
          CLANG_BIN="${{ env.CLANG_BIN }}"

          if [ "${{ github.event.inputs.target_arch }}" == "aarch64" ]; then
            KERNEL_ARCH="arm64"
          else
            KERNEL_ARCH="x86"
          fi

          echo "Kernel Src: $KERNEL_DIR"
          echo "Kernel Out: $KERNEL_OUT"
          echo "Kernel Arch:$KERNEL_ARCH"

          mkdir -p driver-build
          cp ./code/*.c ./code/*.h driver-build/ 2>/dev/null || cp ./code/* driver-build/

          # 模块 Makefile 只声明 obj-m，交叉参数全部走命令行，杜绝版本错配
          KO_NAME="${{ github.event.inputs.driver_name }}"
          MOD_NAME="${KO_NAME%.ko}"
          echo "obj-m += ${MOD_NAME}.o" > driver-build/Makefile
          echo "=== Makefile ==="
          cat driver-build/Makefile

          # 【关键】显式强制 CC/LD 用 prebuilts clang17 + LLVM 全套，绝不落到 Ubuntu clang14
          make -C "$KERNEL_DIR" \
            O="$KERNEL_OUT" \
            ARCH=$KERNEL_ARCH \
            LLVM=1 LLVM_IAS=1 \
            CC="$CLANG_BIN/clang" \
            LD="$CLANG_BIN/ld.lld" \
            NM="$CLANG_BIN/llvm-nm" \
            OBJCOPY="$CLANG_BIN/llvm-objcopy" \
            OBJDUMP="$CLANG_BIN/llvm-objdump" \
            READELF="$CLANG_BIN/llvm-readelf" \
            STRIP="$CLANG_BIN/llvm-strip" \
            M="$(pwd)/driver-build" \
            modules -j$(nproc)

          echo "=== Generated .ko ==="
          find driver-build -name "*.ko"
          echo "=== vermagic check ==="
          modinfo driver-build/${{ github.event.inputs.driver_name }} | grep -i vermagic || true

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-driver-${{ github.event.inputs.target_arch }}
          path: driver-build/${{ github.event.inputs.driver_name }}
          if-no-files-found: error
